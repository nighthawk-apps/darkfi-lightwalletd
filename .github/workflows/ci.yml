name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout darkfi-lightwalletd
        uses: actions/checkout@v4
        with:
          path: darkfi-lightwalletd

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Fetch pinned darkfi-nighthawk-testnet
        working-directory: darkfi-lightwalletd
        run: ./scripts/fetch-darkfi.sh

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: darkfi-lightwalletd

      - name: Check formatting
        working-directory: darkfi-lightwalletd
        run: cargo fmt --check

      - name: Clippy (default features)
        working-directory: darkfi-lightwalletd
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: Clippy (fhe-omr feature)
        working-directory: darkfi-lightwalletd
        run: cargo clippy --all-targets --no-deps --features fhe-omr -- -D warnings

      - name: Test (default features)
        working-directory: darkfi-lightwalletd
        run: cargo test

      - name: Test (fhe-omr feature)
        working-directory: darkfi-lightwalletd
        run: cargo test --release --features fhe-omr

      - name: Dependency advisory check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources
          manifest-path: darkfi-lightwalletd/Cargo.toml
          config: darkfi-lightwalletd/deny.toml
